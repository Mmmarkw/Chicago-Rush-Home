<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>芝加哥：极速下班 / Chicago Rush Home</title>
<style>
:root{
  --flag:#41B6E6; --star:#E4002B; --lake:#14213D; --lake2:#1F3260; --white:#F7F9FC; --amber:#FFB23F; --mist:#A9C7E2;
  --ui:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#101a33;color:var(--white);font-family:var(--ui);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--flag);outline-offset:3px}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}
[hidden]{display:none!important}

/* ---------- route strip (shared by start map + HUD) ---------- */
.strip{position:relative;height:24px}
.strip .track{position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:rgba(65,182,230,.28);overflow:hidden}
.strip .fill{height:100%;width:0;background:var(--flag)}
.strip .stn{position:absolute;top:50%;width:20px;height:20px;transform:translate(-50%,-50%)}
.strip .stn svg{width:100%;height:100%;display:block;fill:var(--lake);stroke:var(--white);stroke-width:.16;stroke-linejoin:round;transition:fill .25s}
.strip .stn.passed svg{fill:var(--star)}
.strip .stn.end svg{fill:var(--white);stroke:none}
.strip .stn.home svg{fill:var(--lake);stroke:var(--white);stroke-width:1.6}
.strip .stn.home.passed svg{fill:var(--star)}
.strip .car{position:absolute;top:50%;left:0;width:18px;height:11px;border-radius:3px 3px 5px 5px;background:var(--star);border:2px solid var(--white);transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.strip .lab{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:700;color:#d5e4f3;letter-spacing:.01em}
.strip .stn:nth-of-type(odd) .lab{bottom:25px}
.strip .stn:nth-of-type(even) .lab{top:25px}
.strip .stn.first .lab{left:0;transform:none}
.strip .stn.home .lab{left:auto;right:0;transform:none}

/* ---------- start screen ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:center;pointer-events:none;z-index:10}
.screen .panel{pointer-events:auto}
#scrStart{justify-content:flex-start;padding:4vh 5vw;background:linear-gradient(90deg,rgba(12,18,40,.66) 0%,rgba(12,18,40,.3) 42%,rgba(12,18,40,0) 66%)}
.panel{background:rgba(20,33,61,.94);border-radius:6px;overflow:hidden;box-shadow:0 30px 80px rgba(6,8,26,.55);backdrop-filter:blur(6px)}
.lines{display:flex;height:9px}
.lines i{flex:1}
.start-panel{width:min(540px,92vw);max-height:92vh;overflow:auto}
.start-body{padding:22px 30px 26px}
.clock{font-size:14px;font-weight:600;color:var(--mist)}
.title{white-space:pre-line;margin:12px 0 0;font-weight:900;line-height:1.02;font-size:clamp(36px,4.9vw,62px);transform:skewX(-7deg);transform-origin:left bottom;text-shadow:4px 4px 0 var(--star)}
.title-alt{display:block;margin-top:10px;font-size:clamp(16px,1.6vw,21px);font-weight:800;color:var(--flag);transform:skewX(-7deg);transform-origin:left}
.pitch{margin:16px 0 8px;font-size:16px;line-height:1.55;color:#dfe8f5;max-width:32em}
.map{margin:38px 6px 40px}
.keys{display:grid;grid-template-columns:max-content 1fr;gap:9px 14px;align-items:center;font-size:15px;color:#e8eef8;margin-bottom:10px}
.keys .kc{display:flex;gap:5px;align-items:center;color:var(--mist);font-size:13px}
kbd{display:inline-flex;min-width:30px;height:28px;padding:0 8px;align-items:center;justify-content:center;background:var(--white);color:var(--lake);border-radius:5px;font:700 13px var(--ui);box-shadow:0 3px 0 #8aa0bd}
kbd.wide{min-width:74px}
.tip{font-size:14px;color:var(--mist);margin:14px 0 20px;line-height:1.5}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cta{border:0;background:var(--star);color:#fff;font-weight:900;font-size:21px;padding:15px 34px;border-radius:6px;box-shadow:0 5px 0 #8c0019;transform:skewX(-7deg);transition:transform .08s,box-shadow .08s}
.cta span{display:inline-block;transform:skewX(7deg)}
.cta:hover{background:#f5122f}
.cta:active{transform:skewX(-7deg) translateY(4px);box-shadow:0 1px 0 #8c0019}
.hint{font-size:13px;color:var(--mist)}
.seg{display:inline-flex;border:2px solid rgba(169,199,226,.5);border-radius:6px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:transparent;color:var(--mist);font-weight:700;font-size:13px;padding:7px 12px}
.seg button[aria-pressed="true"]{background:var(--flag);color:var(--lake)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.hud-top{position:absolute;top:14px;left:16px;right:16px;display:flex;align-items:flex-start;gap:14px}
.hud-card{background:rgba(20,33,61,.8);border-radius:6px;backdrop-filter:blur(4px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.timer{padding:8px 16px 10px;min-width:150px}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--mist)}
.timer .val{display:block;font-size:40px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.timer.low .val{color:#ff5a6e}
.timer.low{animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--star)}}
.route{flex:1;max-width:620px;margin:0 auto;padding:16px 22px 14px}
.hud-btns{display:flex;gap:8px;pointer-events:auto}
.icon-btn{width:44px;height:44px;border:0;border-radius:6px;background:rgba(20,33,61,.8);color:var(--white);font-weight:800;font-size:14px;display:grid;place-items:center}
.icon-btn:hover{background:rgba(31,50,96,.95)}
.icon-btn svg{width:20px;height:20px;fill:currentColor}
.hud-bottom{position:absolute;left:16px;right:16px;bottom:16px;display:flex;align-items:flex-end;gap:14px}
.speed{padding:8px 16px 10px;display:flex;align-items:baseline;gap:6px}
.speed .val{font-size:38px;font-weight:900;font-variant-numeric:tabular-nums;min-width:2.1em;text-align:right}
.speed .unit{font-size:14px;font-weight:700;color:var(--mist)}
.boost{padding:10px 14px 12px;width:min(340px,40vw)}
.boost-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.boost-top span{font-size:13px;font-weight:800}
.boost kbd{height:22px;font-size:11px;min-width:48px;box-shadow:0 2px 0 #8aa0bd}
.bar{height:14px;border-radius:7px;background:rgba(255,178,63,.18);overflow:hidden}
.bar .fill{height:100%;width:100%;background:var(--amber);border-radius:7px}
.boost.on .bar .fill{background:linear-gradient(90deg,var(--amber),#fff3c8,var(--amber));background-size:200% 100%;animation:shine .35s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.boost.empty .bar{box-shadow:inset 0 0 0 2px var(--star)}
.boost-hint{font-size:12px;color:#ffb3bd;margin-top:6px;height:0;overflow:hidden;opacity:0;transition:opacity .2s}
.boost.empty .boost-hint{height:auto;opacity:1}
.hits{margin-left:auto;padding:8px 16px 10px;text-align:right}
.hits .val{display:block;font-size:34px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.hits.bump{animation:bump .4s}
@keyframes bump{30%{transform:scale(1.18);background:rgba(228,0,43,.85)}}
.zone{position:absolute;top:104px;left:50%;transform:translate(-50%,-14px);display:flex;align-items:stretch;background:rgba(20,33,61,.9);border-radius:5px;overflow:hidden;opacity:0;white-space:nowrap}
.zone i{width:8px;background:var(--flag)}
.zone span{padding:9px 18px;font-size:19px;font-weight:800}
.zone.show{animation:zone 3s ease forwards}
@keyframes zone{0%{opacity:0;transform:translate(-50%,-14px)}10%,78%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
.toast{position:absolute;bottom:108px;left:50%;transform:translateX(-50%);max-width:min(560px,84vw);padding:10px 16px;background:rgba(247,249,252,.94);color:var(--lake);border-radius:6px;font-size:15px;font-weight:600;line-height:1.4;opacity:0;text-align:center}
.toast.show{animation:toast 4.2s ease forwards}
@keyframes toast{0%{opacity:0}8%,85%{opacity:1}100%{opacity:0}}
.count{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(90px,14vw,170px);font-weight:900;color:#fff;text-shadow:6px 6px 0 var(--star);pointer-events:none;z-index:6;opacity:0}
.count.pop{animation:pop .72s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.92)}}

/* ---------- result / pause ---------- */
.center{justify-content:center;background:rgba(12,18,40,.42)}
.result{width:min(480px,92vw);text-align:left}
.result-body{padding:24px 30px 28px}
.result h2{font-size:clamp(34px,4.4vw,52px);font-weight:900;line-height:1.05;transform:skewX(-7deg);transform-origin:left bottom;text-shadow:4px 4px 0 var(--star)}
.result.lose h2{text-shadow:4px 4px 0 #52607d}
.result .sub{margin:14px 0 18px;font-size:16px;color:#dfe8f5;line-height:1.5}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.stats div{background:rgba(255,255,255,.06);border-radius:5px;padding:10px 14px}
.stats dt{font-size:12px;font-weight:700;color:var(--mist)}
.stats dd{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:2px}
.rating{display:flex;gap:6px;align-items:center;margin-bottom:20px}
.rating svg{width:34px;height:34px;fill:transparent;stroke:rgba(247,249,252,.55);stroke-width:.12}
.rating svg.on{fill:var(--star);stroke:var(--white)}
.rating p{margin-left:10px;font-size:13px;color:var(--mist);line-height:1.4}
.ghost{border:2px solid rgba(169,199,226,.6);background:transparent;color:var(--white);font-weight:800;font-size:16px;padding:11px 20px;border-radius:6px}
.ghost:hover{border-color:var(--white)}

@media (max-width:720px){
  .route{display:none}
  .timer .val{font-size:30px}
  .speed .val{font-size:28px}
  .hits .val{font-size:26px}
  .map{margin:34px 4px 36px}
  .strip .lab{font-size:10px}
}
@media (max-height:800px){
  .start-body{padding:14px 26px 18px}
  .title{font-size:clamp(30px,4vw,46px);margin-top:8px}
  .title-alt{margin-top:6px}
  .pitch{margin:10px 0 2px;font-size:15px}
  .map{margin:30px 6px 30px}
  .keys{gap:5px 14px;font-size:14px}
  kbd{height:24px;min-width:26px}
  .tip{margin:8px 0 12px;font-size:13px}
  .cta{font-size:19px;padding:11px 26px}
}
@media (max-height:620px){.clock,.tip{display:none}.map{margin:26px 6px 26px}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  .zone.show,.toast.show{animation:none;opacity:1}
}
</style>
</head>
<body>
<canvas id="game" aria-label="Chicago Rush Home"></canvas>

<div id="hud" hidden>
  <div class="hud-top">
    <div class="hud-card timer" id="timerCard"><span class="lbl" data-i18n="timeLeft"></span><span class="val" id="timer">60.0</span></div>
    <div class="hud-card route"><div class="strip" id="hudStrip"></div></div>
    <div class="hud-btns">
      <button class="icon-btn" id="hudLang"></button>
      <button class="icon-btn" id="hudMute"></button>
      <button class="icon-btn" id="hudPause"><svg viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg></button>
    </div>
  </div>
  <div class="zone" id="zone"><i></i><span id="zoneText"></span></div>
  <div class="toast" id="toast"></div>
  <div class="hud-bottom">
    <div class="hud-card speed"><span class="val" id="speed">0</span><span class="unit" id="speedUnit"></span></div>
    <div class="hud-card boost" id="boostCard">
      <div class="boost-top"><span data-i18n="boost"></span><kbd data-i18n="kSpace"></kbd></div>
      <div class="bar"><div class="fill" id="boostFill"></div></div>
      <div class="boost-hint" data-i18n="empty"></div>
    </div>
    <div class="hud-card hits" id="hitsCard"><span class="lbl" data-i18n="hits"></span><span class="val" id="hits">0</span></div>
  </div>
</div>
<div class="count" id="count" aria-live="assertive"></div>

<section class="screen" id="scrStart">
  <div class="panel start-panel">
    <div class="lines" aria-hidden="true"><i style="background:#C60C30"></i><i style="background:#00A1DE"></i><i style="background:#62361B"></i><i style="background:#009B3A"></i><i style="background:#F9461C"></i><i style="background:#522398"></i><i style="background:#E27EA6"></i><i style="background:#F9E300"></i></div>
    <div class="start-body">
      <p class="clock" data-i18n="clock"></p>
      <h1 class="title" id="titleMain"></h1>
      <span class="title-alt" id="titleAlt"></span>
      <p class="pitch" data-i18n="pitch"></p>
      <div class="map"><div class="strip" id="mapStrip"></div></div>
      <div class="keys">
        <span class="kc"><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd></span><span data-i18n="kSteer"></span>
        <span class="kc"><kbd class="wide" data-i18n="kSpace"></kbd></span><span data-i18n="kBoost"></span>
        <span class="kc"><kbd>P</kbd> / <kbd>Esc</kbd></span><span data-i18n="kPause"></span>
        <span class="kc"><kbd>M</kbd></span><span data-i18n="kMute"></span>
      </div>
      <p class="tip" data-i18n="tip"></p>
      <div class="row">
        <button class="cta" id="btnStart"><span data-i18n="start"></span></button>
        <span class="hint" data-i18n="orEnter"></span>
        <div class="seg" role="group" aria-label="Language">
          <button id="langZh" aria-pressed="true">中文</button><button id="langEn" aria-pressed="false">English</button>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="screen center" id="scrPause" hidden>
  <div class="panel result">
    <div class="lines" aria-hidden="true"><i style="background:#41B6E6"></i></div>
    <div class="result-body">
      <h2 data-i18n="paused"></h2>
      <p class="sub" data-i18n="pausedSub"></p>
      <div class="row"><button class="cta" id="btnResume"><span data-i18n="resume"></span></button><button class="ghost" id="btnRestart" data-i18n="restart"></button></div>
      <p class="hint" style="margin-top:14px" data-i18n="resumeHint"></p>
    </div>
  </div>
</section>

<section class="screen center" id="scrWin" hidden>
  <div class="panel result">
    <div class="lines" aria-hidden="true"><i style="background:#41B6E6"></i><i style="background:#fff"></i><i style="background:#41B6E6"></i></div>
    <div class="result-body">
      <h2 data-i18n="winTitle"></h2>
      <p class="sub" id="winSub"></p>
      <dl class="stats">
        <div><dt data-i18n="statTime"></dt><dd id="stTime"></dd></div>
        <div><dt data-i18n="statHits"></dt><dd id="stHits"></dd></div>
        <div><dt data-i18n="statNear"></dt><dd id="stNear"></dd></div>
        <div><dt data-i18n="statLeft"></dt><dd id="stLeft"></dd></div>
      </dl>
      <div class="rating" id="rating"></div>
      <div class="row"><button class="cta" id="btnAgain"><span data-i18n="again"></span></button><span class="hint" data-i18n="orEnter"></span></div>
    </div>
  </div>
</section>

<section class="screen center" id="scrLose" hidden>
  <div class="panel result lose">
    <div class="lines" aria-hidden="true"><i style="background:#52607d"></i></div>
    <div class="result-body">
      <h2 data-i18n="loseTitle"></h2>
      <p class="sub" id="loseSub"></p>
      <dl class="stats">
        <div><dt data-i18n="statProg"></dt><dd id="stProg"></dd></div>
        <div><dt data-i18n="statHits"></dt><dd id="stHits2"></dd></div>
      </dl>
      <div class="row"><button class="cta" id="btnRetry"><span data-i18n="retry"></span></button><span class="hint" data-i18n="orEnter"></span></div>
    </div>
  </div>
</section>

   ========================================================= */
const canvas=$('#game');const ctx=canvas.getContext('2d');
let W=1,H=1,horizonY=0;
function resize(){
  const w=innerWidth,h=innerHeight;let s=Math.min(window.devicePixelRatio||1,1.75);
  if(w*h*s*s>3.2e6)s=Math.sqrt(3.2e6/(w*h));
  W=w;H=h;canvas.width=Math.round(w*s);canvas.height=Math.round(h*s);ctx.setTransform(s,0,0,s,0,0);

const cam={x:0,y:CAM_H,z:-CAM_BACK,pitch:PITCH,yaw:0,fov:FOV*Math.PI/180,F:1,cx:0,cy:0,sp:0,cp:1,sy:0,cyw:1};
function camUpdate(){
  cam.sp=Math.sin(cam.pitch);cam.cp=Math.cos(cam.pitch);cam.sy=Math.sin(cam.yaw);cam.cyw=Math.cos(cam.yaw);
  cam.F=(H/2)/Math.tan(cam.fov/2);cam.cx=W/2;cam.cy=H/2;horizonY=cam.cy-cam.F*Math.tan(cam.pitch);

function toCam(x,y,z,o){const dx=x-cam.x,dy=y-cam.y,dz=z-cam.z;const xc=dx*cam.cyw-dz*cam.sy;const zf=dx*cam.sy+dz*cam.cyw;

const _t=[0,0,0],_u=[0,0,0];
function camDepth(x,y,z){toCam(x,y,z,_t);return _t[2];}
function proj(x,y,z){toCam(x,y,z,_t);if(_t[2]<NEAR)return null;const s=cam.F/_t[2];return [cam.cx+_t[0]*s,cam.cy-_t[1]*s,_t[2],s];}

/* polygon with near-plane clipping */
function pathPoly(pts){
  const n=pts.length;const cp=new Array(n);let allIn=true,anyIn=false;
  for(let i=0;i<n;i++){const p=pts[i];const c=toCam(p[0],p[1],p[2],[0,0,0]);cp[i]=c;if(c[2]<NEAR)allIn=false;else anyIn=true;}
  if(!anyIn)return false;
  let q=cp;
  if(!allIn){q=[];for(let i=0;i<n;i++){const a=cp[i],b=cp[(i+1)%n];const ai=a[2]>=NEAR,bi=b[2]>=NEAR;if(ai)q.push(a);
    if(ai!==bi){const t=(NEAR-a[2])/(b[2]-a[2]);q.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,NEAR]);}}
    if(q.length<3)return false;}
  for(let i=0;i<q.length;i++){const s=cam.F/q[i][2];const X=cam.cx+q[i][0]*s,Y=cam.cy-q[i][1]*s;if(i)ctx.lineTo(X,Y);else ctx.moveTo(X,Y);}

function fillPoly(pts,fill,stroke){ctx.beginPath();if(!pathPoly(pts))return false;ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=1.1;ctx.strokeStyle=stroke;ctx.stroke();}return true;}

  toCam(c[0],c[1],c[2],_t);if(_t[2]<NEAR)return;const s2=cam.F/_t[2],x2=cam.cx+_t[0]*s2,y2=cam.cy-_t[1]*s2;
  toCam(d[0],d[1],d[2],_t);if(_t[2]<NEAR)return;const s3=cam.F/_t[2],x3=cam.cx+_t[0]*s3,y3=cam.cy-_t[1]*s3;

/* ---------------- boxes (vehicles, trains, small structures) ---------------- */
function mkBox(cx,cz,yaw,y0,y1,w0,l0,w1,l1,off0,off1){
  const sf=Math.sin(yaw),cf=Math.cos(yaw);
  const P=(a,b,y)=>[cx+a*cf+b*sf,y,cz-a*sf+b*cf];
  const hw0=w0/2,hl0=l0/2,hw1=w1/2,hl1=l1/2;off0=off0||0;off1=off1||0;
  const bRL=P(-hw0,-hl0+off0,y0),bRR=P(hw0,-hl0+off0,y0),bFR=P(hw0,hl0+off0,y0),bFL=P(-hw0,hl0+off0,y0);
  const tRL=P(-hw1,-hl1+off1,y1),tRR=P(hw1,-hl1+off1,y1),tFR=P(hw1,hl1+off1,y1),tFL=P(-hw1,hl1+off1,y1);
  return {rear:[bRL,bRR,tRR,tRL],front:[bFR,bFL,tFL,tFR],left:[bFL,bRL,tRL,tFL],right:[bRR,bFR,tFR,tRR],top:[tRL,tRR,tFR,tFL],c:[cx,(y0+y1)/2,cz]};
}
function faceN(q,c){
  const ax=q[3][0]-q[0][0],ay=q[3][1]-q[0][1],az=q[3][2]-q[0][2],bx=q[1][0]-q[0][0],by=q[1][1]-q[0][1],bz=q[1][2]-q[0][2];
  let n=[ay*bz-az*by,az*bx-ax*bz,ax*by-ay*bx];
  const fx=(q[0][0]+q[2][0])/2-c[0],fy=(q[0][1]+q[2][1])/2-c[1],fz=(q[0][2]+q[2][2])/2-c[2];
  if(n[0]*fx+n[1]*fy+n[2]*fz<0)n=[-n[0],-n[1],-n[2]];return norm3(n);
}
function faceVis(q,n){return n[0]*(q[0][0]-cam.x)+n[1]*(q[0][1]-cam.y)+n[2]*(q[0][2]-cam.z)<0;}
const FACES=['left','right','rear','front','top'];
function drawBox(b,cols,fog,stroke,skip){
  const vis={};
  for(const f of FACES){if(skip&&skip[f])continue;const q=b[f];const n=faceN(q,b.c);if(!faceVis(q,n))continue;
    const col=cols[f]||cols.side;fillPoly(q,lit(col,n,fog),stroke);vis[f]=true;}

}
function sub(q,u0,u1,v0,v1){const P=(u,v)=>lerp3(lerp3(q[0],q[1],u),lerp3(q[3],q[2],u),v);return [P(u0,v0),P(u1,v0),P(u1,v1),P(u0,v1)];}

/* ---------------- sky ---------------- */
function dirPt(az,el){const d=5000;return proj(cam.x+Math.sin(az)*Math.cos(el)*d,cam.y+Math.sin(el)*d,cam.z+Math.cos(az)*Math.cos(el)*d);}
function drawSky(){
  const hy=Math.max(horizonY,2);
  const g=ctx.createLinearGradient(0,hy-H*0.55,0,hy);
  g.addColorStop(0,'#26286a');g.addColorStop(0.35,'#5b3d8f');g.addColorStop(0.65,'#c9618f');g.addColorStop(0.88,'#ff9d7a');g.addColorStop(1,rgbS(FOG));

  const sp=dirPt(-0.95,0.03);
  if(sp){const r=W*0.55;const rg=ctx.createRadialGradient(sp[0],sp[1],0,sp[0],sp[1],r);
    rg.addColorStop(0,'rgba(255,236,170,0.85)');rg.addColorStop(0.25,'rgba(255,190,120,0.35)');rg.addColorStop(1,'rgba(255,160,120,0)');
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,hy+2);}
  for(const c of CLOUDS){
    const p=dirPt(c.az+time*c.sp,c.el);if(!p||p[0]<-W||p[0]>2*W)continue;
    const w=c.w*cam.F;const h=w*0.16;
    ctx.fillStyle='rgba(255,168,176,0.78)';
    ctx.beginPath();
    for(let i=0;i<5;i++){const o=hash1(c.seed*9+i);ctx.ellipse(p[0]+(i-2)*w*0.22,p[1]-o*h*0.9,w*(0.2+o*0.12),h*(0.7+o*0.5),0,0,Math.PI*2);}
    ctx.fill();
    ctx.fillStyle='rgba(255,226,196,0.7)';ctx.beginPath();
    for(let i=0;i<3;i++){const o=hash1(c.seed*5+i);ctx.ellipse(p[0]+(i-1)*w*0.25-w*0.05,p[1]-h*0.8-o*h*0.4,w*0.18,h*0.45,0,0,Math.PI*2);}
    ctx.fill();

}

/* ---------------- ground ---------------- */
let gz0=0,gz1=0;
function gRect(lx0,lx1,z0,z1,col){
  if(z1<gz0||z0>gz1)return;z0=Math.max(z0,gz0);z1=Math.min(z1,gz1);if(z1<=z0)return;
  const curved=!(z1<=1120||z0>=1830);
  if(col===null){gPath(lx0,lx1,z0,z1,curved);return;}
  ctx.fillStyle=col;ctx.beginPath();
  if(!curved){const a=roadX(z0),b=roadX(z1);pathPoly([[a+lx0,0,z0],[a+lx1,0,z0],[b+lx1,0,z1],[b+lx0,0,z1]]);}
  else{for(let z=z0;z<z1;z+=10){const za=z,zb=Math.min(z1,z+10);const a=roadX(za),b=roadX(zb);pathPoly([[a+lx0,0,za],[a+lx1,0,za],[b+lx1,0,zb],[b+lx0,0,zb]]);}}

}
function gPath(lx0,lx1,z0,z1,curved){
  if(!curved){const a=roadX(z0),b=roadX(z1);pathPoly([[a+lx0,0,z0],[a+lx1,0,z0],[b+lx1,0,z1],[b+lx0,0,z1]]);}
  else{for(let z=z0;z<z1;z+=10){const za=z,zb=Math.min(z1,z+10);const a=roadX(za),b=roadX(zb);pathPoly([[a+lx0,0,za],[a+lx1,0,za],[b+lx1,0,zb],[b+lx0,0,zb]]);}}
}
function batch(col,fn){ctx.fillStyle=col;ctx.beginPath();fn();ctx.fill();}
function drawGround(){
  const hy=horizonY;ctx.fillStyle=rgbS(FOG);ctx.fillRect(0,Math.max(0,hy-1),W,H);
  gz0=cam.z-6;gz1=cam.z+GDRAW;
  // base areas
  gRect(-900,900,-300,540,G.plaza);
  gRect(-900,900,540,548,G.riverwalk);
  gRect(-2500,2500,548,608,G.water);
  gRect(-900,900,608,616,G.riverwalk);
  gRect(-900,900,616,1115,G.plaza);
  gRect(-900,-7,1115,1850,G.park);
  gRect(-10.5,-7,1115,1850,G.median);
  gRect(-24.5,-10.5,1115,1850,G.asphalt);
  gRect(-32,-29.5,1115,1850,G.path);
  gRect(-900,-7,1850,2700,G.grass);
  gRect(-12,-7,1850,2700,G.sidewalk);
  gRect(20,2500,1115,1900,G.lake);
  gRect(9,20,1115,1900,G.sand);
  gRect(7,9,1115,1900,G.path);
  gRect(7,900,1900,2700,G.grass);
  gRect(7,10,1900,2700,G.sidewalk);
  // sidewalks, other bridges, cross streets, main road
  gRect(-12,-7,-300,548,G.sidewalk);gRect(7,12,-300,548,G.sidewalk);
  gRect(-12,-7,608,1115,G.sidewalk);gRect(7,12,608,1115,G.sidewalk);
  gRect(-12,-7,548,608,G.deckWalk);gRect(7,12,548,608,G.deckWalk);
  for(const bx of [-220,-110,110,220])gRect(bx-9,bx+9,548,608,G.deckRoad);
  for(const s of STREETS){if(s.z>1110)continue;gRect(-900,900,s.z-7,s.z+7,G.asphaltX);}
  gRect(-7,7,-300,548,G.asphalt);gRect(-7,7,548,608,G.deckRoad);gRect(-7,7,608,2700,G.asphalt);
  drawMarkings();
  drawWater();
  drawShadows();
  groundFog();
  drawBeams();
}
function drawMarkings(){
  const z0=Math.floor(gz0/10)*10;
  const vis=STREETS.filter(s=>s.z<=1110&&s.z>gz0-10&&s.z<gz1+10);
  batch(G.line,()=>{
    for(let z=z0;z<gz1;z+=10){
      if(!inInter(z,z+3.2))for(const lx of [-3.5,0,3.5])gRect(lx-0.09,lx+0.09,z,z+3.2,null);
      if(z>1115&&z<1850)for(const lx of [-14,-17.5,-21])gRect(lx-0.09,lx+0.09,z,z+3.2,null);
    }
    for(const [a,b] of EDGE_SEGS)gRect(6.78,6.95,a,b,null);
    gRect(-24.2,-24.03,1115,1850,null);
    for(const s of vis)for(let i=0;i<12;i++){const lx=-6.55+i*1.18;gRect(lx,lx+0.56,s.z-6.8,s.z-4.6,null);gRect(lx,lx+0.56,s.z+4.6,s.z+6.8,null);}
    if(CFG.ROUTE>gz0-5&&CFG.ROUTE<gz1)gRect(-7,7,CFG.ROUTE-2.5,CFG.ROUTE,null);
  });
  batch(G.yellow,()=>{
    for(const [a,b] of EDGE_SEGS)gRect(-6.95,-6.78,a,b,null);
    gRect(-10.95,-10.78,1115,1850,null);
    for(const s of vis){gRect(-900,-7.5,s.z-0.22,s.z-0.08,null);gRect(-900,-7.5,s.z+0.08,s.z+0.22,null);gRect(7.5,900,s.z-0.22,s.z-0.08,null);gRect(7.5,900,s.z+0.08,s.z+0.22,null);}
  });
  if(CFG.ROUTE>gz0-5&&CFG.ROUTE<gz1)batch(G.dark,()=>{for(let i=0;i<14;i++)for(let r=0;r<2;r++)if((i+r)%2)gRect(-7+i,-6+i,CFG.ROUTE-2.5+r*1.25,CFG.ROUTE-2.5+(r+1)*1.25,null);});
}
function drawWater(){
  ctx.lineCap='round';
  if(gz1>548&&gz0<608){
    ctx.strokeStyle='rgba(200,255,236,0.55)';ctx.lineWidth=1.6;ctx.beginPath();
    for(let i=0;i<80;i++){const h1=hash1(i*3+1),h2=hash1(i*7+2),h3=hash1(i*11+5);
      const z=549.5+h2*57;const x=((h1*460+time*(1.5+h3*2.5))%460)-230;const len=1.5+h3*3.5;
      if(Math.abs(x)<12.5||Math.abs(x+len)<12.5)continue;segSub([x,0.03,z],[x+len,0.03,z]);}
    ctx.stroke();
  }
  const zA=Math.max(gz0,1117),zB=Math.min(gz1,1900);
  if(zB>zA){
    ctx.strokeStyle='rgba(255,214,206,0.62)';ctx.lineWidth=1.4;ctx.beginPath();
    for(let iz=Math.floor(zA/11);iz*11<zB;iz++){for(let ix=0;ix<18;ix++){
      const h=hash3(ix,iz,7);if(h<0.45)continue;const ph=Math.sin(time*1.8+h*40);if(ph<0.1)continue;
      const lx=22+ix*14+hash3(ix,iz,3)*9,z=iz*11+hash3(ix,iz,5)*9,len=1.5+h*4;const rx=roadX(z);
      segSub([rx+lx,0.03,z],[rx+lx+len,0.03,z]);}}
    ctx.stroke();
  }
}
function shadowAt(wx,wz,yaw,w,l){
  const sf=Math.sin(yaw),cf=Math.cos(yaw);const pts=[];
  for(let i=0;i<10;i++){const t=i/10*Math.PI*2;const a=Math.cos(t)*(w/2+0.3),b=Math.sin(t)*(l/2+0.35);pts.push([wx+0.45+a*cf+b*sf,0.02,wz+0.35-a*sf+b*cf]);}
  pathPoly(pts);
}
function drawShadows(){
  ctx.fillStyle='rgba(22,14,48,0.32)';ctx.beginPath();
  for(const c of traffic){if(c.z<cam.z-5||c.z>cam.z+DDRAW)continue;shadowAt(roadX(c.z)+c.lx,c.z,Math.atan(roadSlope(c.z)),c.w,c.l);}
  for(const c of oncoming){if(c.z<cam.z-5||c.z>cam.z+DDRAW)continue;shadowAt(roadX(c.z)+c.lx,c.z,0,c.w,c.l);}
  shadowAt(roadX(player.z)+player.lx,player.z,Math.atan(roadSlope(player.z)),CFG.PW,CFG.PL);
  ctx.fill();
}
function groundFog(){
  const hy=horizonY;if(hy>=H)return;
  const g=ctx.createLinearGradient(0,hy,0,H);
  const stops=[[0,1]];
  for(const zc of [290,240,190,150,115,85,60,45,FOG0]){
    const d=(zc-cam.y*cam.sp)/cam.cp;const yc=-cam.y*cam.cp+d*cam.sp;const sy=cam.cy-yc*cam.F/zc;
    const t=(sy-hy)/(H-hy);if(t>0&&t<1)stops.push([t,gFog(zc)]);}
  stops.sort((a,b)=>a[0]-b[0]);
  for(const [t,a] of stops)g.addColorStop(t,rgbS(FOG,a.toFixed(3)));
  ctx.fillStyle=g;ctx.fillRect(0,hy,W,H-hy);
}
function drawBeams(){
  if(player.pop<0.25)return;
  const yaw=Math.atan(roadSlope(player.z))+player.vx*0.022;const L=localFn(roadX(player.z)+player.lx,player.z,yaw);
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=`rgba(255,232,170,${0.16*player.pop})`;
  for(const a of [-0.52,0.52]){ctx.beginPath();pathPoly([L(a-0.25,2.1,0.04),L(a+0.25,2.1,0.04),L(a+3.2,26,0.04),L(a-2.6,26,0.04)]);ctx.fill();}
  ctx.restore();
}

/* ---------------- buildings ---------------- */
function drawPart(p){
  const n=p.fp.length;const B=[],Tp=[];let cx=0,cz=0;
  for(const q of p.fp){const wx=roadX(q[1])+q[0];B.push([wx,p.y0,q[1]]);cx+=wx;cz+=q[1];}
  cx/=n;cz/=n;const s=p.top;
  for(const b of B)Tp.push([cx+(b[0]-cx)*s,p.y1,cz+(b[2]-cz)*s]);
  const dep=camDepth(cx,(p.y0+p.y1)/2,cz);if(dep<-60)return;
  const fog=fogF(Math.max(dep,0));
  for(let i=0;i<n;i++){
    const j=(i+1)%n;const a=B[i],b=B[j];
    const nx=b[2]-a[2],nz=-(b[0]-a[0]);
    const mx=(a[0]+b[0])/2-cam.x,mz=(a[2]+b[2])/2-cam.z;
    if(nx*mx+nz*mz>=0)continue;
    const l=Math.hypot(nx,nz);const nn=[nx/l,0,nz/l];
    if(!fillPoly([a,b,Tp[j],Tp[i]],lit(p.col,nn,fog)))continue;
    if(p.win&&dep<230){const wd=Math.max(4,Math.min(camDepth(a[0],(p.y0+p.y1)/2,a[2]),camDepth(b[0],(p.y0+p.y1)/2,b[2]),dep));drawWin(p,a,b,Tp[j],Tp[i],nn,fog,wd,i);}
  }
  if(cam.y>p.y1)fillPoly(Tp,lit(p.col,UP,fog));
}
function drawWin(p,a,b,tb,ta,nn,fog,dep,wi){
  const h=p.y1-p.y0;if(h<3)return;
  const wl=Math.hypot(b[0]-a[0],b[2]-a[2]);if(wl<2)return;
  const scale=cam.F/dep;
  const L=(u,v)=>lerp3(lerp3(a,b,u),lerp3(ta,tb,u),v);
  if(p.win==='h'){
    const fh=p.floor;const floors=Math.floor((h-0.8)/fh);if(floors<1)return;
    let step=1;while(floors/step>22)step++;
    if(fh*scale<2.2)return;
    const bh=p.scallop?0.28:0.36;
    const nsu=dep<90?Math.max(1,Math.ceil(wl/5)):1;
    ctx.fillStyle=emis(shade(p.wc,nn),fog);ctx.beginPath();
    for(let k=0;k<floors;k+=step){const v0=(k*fh+fh*0.35)/h,v1=(k*fh+fh*(0.35+bh*Math.min(step,1.8)))/h;
      for(let q=0;q<nsu;q++){const u0=0.05+0.9*q/nsu,u1=0.05+0.9*(q+1)/nsu;quadSub(L(u0,v0),L(u1,v0),L(u1,v1),L(u0,v1));}}
    ctx.fill();
    if(p.lit>0&&dep<170){
      const segs=Math.max(2,Math.round(wl/3.4));let cnt=0;
      ctx.fillStyle=emis(LITC,fog*0.7);ctx.beginPath();
      for(let k=0;k<floors&&cnt<110;k+=step){const v0=(k*fh+fh*0.35)/h,v1=(k*fh+fh*(0.35+bh))/h;
        for(let sI=0;sI<segs;sI++){if(hash3(p.seed,k*31+wi,sI)>=p.lit)continue;const u0=0.05+0.9*sI/segs,u1=0.05+0.9*(sI+0.7)/segs;
          quadSub(L(u0,v0),L(u1,v0),L(u1,v1),L(u0,v1));cnt++;}}
      ctx.fill();
    }
  }else if(p.win==='v'||p.win==='x'){
    const cols=Math.floor(wl/2.8);if(cols<2||2.8*scale<2.5)return;
    let step=1;while(cols/step>34)step++;
    const mw=0.22/wl;
    ctx.fillStyle=emis(shade(p.wc,nn),fog);ctx.beginPath();
    if(p.win==='v'){for(let c=step;c<cols;c+=step){const u=c/cols;quadSub(L(u-mw,0.005),L(u+mw,0.005),L(u+mw,0.995),L(u-mw,0.995));}}

    if(p.win==='x'){const lv=5,dw=0.018;for(let k=0;k<lv;k++){const v0=k/lv,v1=(k+1)/lv;

      quadSub(L(0,v1-0.004),L(1,v1-0.004),L(1,v1+0.004),L(0,v1+0.004));}}
    ctx.fill();
    if(p.lit>0&&dep<170){

      ctx.fillStyle=emis(LITC,fog*0.7);ctx.beginPath();

        const u0=(c+0.18)/cols,u1=(c+step-0.18)/cols,v0=(k*fh+0.9)/h,v1=(k*fh+2.8)/h;quadSub(L(u0,v0),L(u1,v0),L(u1,v1),L(u0,v1));cnt++;}}

}

function drawCar(c){
  const wx=roadX(c.z)+c.lx;const dep=camDepth(wx,1,c.z);if(dep<0.9)return;const fog=fogF(dep);

  const yaw=Math.atan(roadSlope(c.z))+(c.yawOff||0)+(onc?Math.PI:0);
  const y=c.y||0;const near=dep<120;const st=dep<170?OUTL:null;const col=c.col;
  if(c.type==='bus'){
    if(near)drawUnder(wx,c.z,yaw,c.w,c.l,0.9,y,fog);
    const b=mkBox(wx,c.z,yaw,y+0.35,y+3.15,c.w,c.l,c.w*0.98,c.l*0.99);
    const v=drawBox(b,{side:[240,242,246],top:[214,218,226]},fog,st);
    for(const f of ['left','right'])if(v[f]){const q=b[f];fillPoly(sub(q,0.03,0.97,0.46,0.84),emis([42,54,76],fog));fillPoly(sub(q,0,1,0.3,0.38),emis([0,96,176],fog));fillPoly(sub(q,0,1,0.26,0.3),emis([228,0,43],fog));}
    if(v.rear){const q=b.rear;fillPoly(sub(q,0.1,0.9,0.56,0.8),emis([42,54,76],fog));fillPoly(sub(q,0,1,0.3,0.38),emis([0,96,176],fog));
      const led=sub(q,0.22,0.78,0.84,0.95);fillPoly(led,emis([20,20,24],fog));tailLights(sub(q,0,1,0,0.45),fog,near);
      const m=lerp3(led[0],led[2],0.5);const p=proj(m[0],m[1],m[2]);if(p&&p[3]*0.3>6){ctx.fillStyle='#ffb020';ctx.font=`700 ${(p[3]*0.3)|0}px Helvetica,Arial,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c.route,p[0],p[1]);}}
    if(v.front&&onc)headLights(sub(b.front,0,1,0,0.4),fog);
    if(near)drawBox(mkBox(wx,c.z,yaw,y+3.15,y+3.5,1.6,2.6,1.4,2.4,-1,-1),{side:[200,204,212]},fog);
    return;
  }
  if(c.type==='truck'){
    if(near)drawUnder(wx,c.z,yaw,c.w,c.l,0.85,y,fog);
    const sf=Math.sin(yaw),cf=Math.cos(yaw);const off=(b)=>[wx+b*sf,c.z+b*cf];

    const cargo=mkBox(box[0],box[1],yaw,y+0.45,y+3.3,c.w,c.l-2.5,c.w,c.l-2.5);
    // draw nearer-to-camera part last: from behind, cargo is nearer
    const cabFirst=!onc;
    const dcab=()=>{const v=drawBox(cb,{side:col,top:col},fog,st);if(v.front)fillPoly(sub(cb.front,0.08,0.92,0.5,0.9),emis([50,64,90],fog));if(v.front&&onc)headLights(sub(cb.front,0,1,0,0.4),fog);};
    const dcar=()=>{const v=drawBox(cargo,{side:c.col2,top:c.col2.map(v=>v*0.95)},fog,st);if(v.rear){fillPoly(sub(cargo.rear,0.495,0.505,0.05,0.95),emis([120,120,130],fog));tailLights(sub(cargo.rear,0,1,0,0.3),fog,near);}
      for(const f of ['left','right'])if(v[f])fillPoly(sub(cargo[f],0.1,0.9,0.45,0.62),emis(col,fog));};
    if(cabFirst){dcab();dcar();}else{dcar();dcab();}
    return;
  }
  const suv=c.type==='suv';
  if(near)drawUnder(wx,c.z,yaw,c.w,c.l,0.6,y,fog);

/* ---------------- scene layers ---------------- */
function lowerBound(arr,z){let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(arr[m].z<z)lo=m+1;else hi=m;}return lo;}
function trainPieces(){
  const out=[];
  for(const t of trains){
    if(t.cz<cam.z-40||t.cz>cam.z+700)continue;
    for(let i=0;i<t.n;i++){
      const f=t.x-t.dir*i*(t.len+t.gap),bk=f-t.dir*t.len;const x0=Math.min(f,bk),x1=Math.max(f,bk);
      if(x1<-200||x0>200)continue;
      const segs=[];let a=x0;for(const c of [-12,12]){if(c>a&&c<x1){segs.push([a,c]);a=c;}}segs.push([a,x1]);
      for(const [s0,s1] of segs)out.push({kind:'train',x0:s0,x1:s1,z:t.z,key:t.cz-3.36,col:t.col,capL:s0===x0,capR:s1===x1,center:Math.abs((s0+s1)/2)<12});
    }
  }
  return out;
}
let FONT='sans-serif';
function inView(b){
  if(b.cx===undefined){b.cx=(b.x0+b.x1)/2;b.czz=(b.z0+b.z1)/2;b.rad=Math.hypot(b.x1-b.x0,b.z1-b.z0)/2+2;}
  toCam(roadX(b.czz)+b.cx,cam.y,b.czz,_t);
  if(_t[2]+b.rad<NEAR)return false;
  const th=Math.tan(cam.fov/2)*W/H*1.08;

}
function drawScene(){

  for(const p of tp)if(!p.center)L1.push(p);
  for(const bt of boats)if(Math.abs(bt.z-cam.z)<700&&bt.z>cam.z-20)L1.push({kind:'boat',ref:bt,key:bt.z-8});
  L1.sort((a,b)=>b.key-a.key);

    if(o.kind==='bld')drawBld(o);else if(o.kind==='lpart')drawLPart(o.cz,o.xa,o.xb,o.piece);else if(o.kind==='train')drawTrain(o);
    else if(o.kind==='sail')drawSail(o.ref);else if(o.kind==='boat')drawBoat(o.ref);

}

function pickType(zi,lane){
  const r=Math.random();
  if(zi===4||zi===3){if(lane===3&&r<0.05)return 'bus';if(r<0.15)return 'taxi';if(r<0.42)return 'suv';if(r<0.55)return 'compact';return 'sedan';}
  if(zi===5){if(r<0.35)return 'suv';if(r<0.5)return 'compact';return 'sedan';}
  if(lane>=2&&r<0.12)return 'bus';if(lane>=2&&r<0.2)return 'truck';
  if(r<0.42)return 'taxi';if(r<0.6)return 'suv';if(r<0.72)return 'compact';return 'sedan';
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
/* spawn a "wave" of traffic across lanes, always leaving a reachable free lane */
function spawnWave(z,easy){
  const zi=zoneIdx(z);const Z=ZONES[zi];let w=Z.w;
  if(easy||elapsed<4)w=[0.7,0.3,0];
  const r=Math.random();let count=r<w[0]?1:r<w[0]+w[1]?2:3;
  if(count===3&&spawner.lastCount===3)count=2;
  let s=spawner.safe;
  if(!easy){const m=Math.random();if(m<0.33&&s>0)s--;else if(m>0.67&&s<3)s++;}
  const lanes=shuffle([0,1,2,3].filter(l=>l!==s)).slice(0,count);
  let maxL=4.5;
  for(const ln of lanes){
    const type=pickType(zi,ln);const sp=VEH[type];
    const zz=z+(Math.random()*2-1)*2.5+(sp.l-4.5)/2;
    const col=type==='taxi'?[255,198,28]:CAR_COLS[(Math.random()*CAR_COLS.length)|0];
    traffic.push({kind:'car',type,lx:LANES[ln],z:zz,w:sp.w,l:sp.l,col,col2:TRUCK_COLS[(Math.random()*3)|0],v:CFG.TRAFFIC_V,y:0,vy:0,hit:false,passed:false,ghost:false,yawOff:0,push:0,hitT:0,
      route:zi>=3?(Math.random()<.5?'146':'151'):'36'});
    maxL=Math.max(maxL,sp.l);
  }
  spawner.lastCount=count;spawner.safe=s;
  spawner.next=Z.spacing*(easy?1.15:1)+(maxL-4.5);
}

/* ---------------- updates ---------------- */
function updateTrains(dt){
  for(let i=0;i<2;i++){const cz=L_CROSS[i];if(cz<cam.z-40||cz>cam.z+650)continue;trainTimers[i]-=dt;if(trainTimers[i]<=0){spawnTrain(i,Math.random()<.5?1:-1);trainTimers[i]=7+Math.random()*7;}}
  for(const t of trains){t.x+=t.dir*t.v*dt;
    if(!t.rumbled&&Math.abs(t.cz-player.z)<45&&Math.abs(t.x-t.dir*t.n*7.6)<40&&(state==='playing'||state==='countdown')){t.rumbled=true;AudioSys.rumble();}}
  trains=trains.filter(t=>t.dir>0?(t.x-t.n*(t.len+t.gap))<240:(t.x+t.n*(t.len+t.gap))>-240);
  for(const b of boats){b.x+=b.dir*b.v*dt;if(b.x>b.max){b.x=b.max;b.dir=-1;}if(b.x<b.min){b.x=b.min;b.dir=1;}}
}
function addPart(o){particles.push(o);if(particles.length>500)particles.shift();}
function popup(text,col,big){popups.push({text,col,big,t:0,life:big?1.1:1.2,x:roadX(player.z)+player.lx,y:2.6,z:player.z+1.5});}
function updatePlayer(dt){
  const P=player;const ctl=state==='playing';
  const steer=ctl?((keys.right?1:0)-(keys.left?1:0)):0;
  P.vx+=(steer*CFG.LAT_MAX-P.vx)*(1-Math.exp(-CFG.LAT_RESP*dt));
  P.lx+=P.vx*dt;
  P.scrapeT-=dt;
  if(P.lx>LIM||P.lx<-LIM){const s=Math.sign(P.lx);P.lx=s*LIM;if(P.vx*s>0){if(Math.abs(P.vx)>2.5&&P.scrapeT<=0){scrape(s);P.scrapeT=0.12;}P.vx=0;}}
  P.invuln=Math.max(0,P.invuln-dt);P.stun=Math.max(0,P.stun-dt);
  const holding=ctl&&keys.boost;
  const want=holding&&P.stun<=0;
  P.boosting=want&&P.energy>0;
  if(want&&P.energy<=0&&!P.noEWarned){P.noEWarned=true;popup(T().noE,'#ffb3bd',false);}
  if(!keys.boost)P.noEWarned=false;
  if(P.boosting){P.energy=Math.max(0,P.energy-CFG.E_DRAIN*dt);P.regenDelay=CFG.E_DELAY;stats.boostTime+=dt;}
  else if(!holding){P.regenDelay-=dt;if(P.regenDelay<=0)P.energy=Math.min(CFG.E_MAX,P.energy+CFG.E_REGEN*dt);}
  if(P.boosting&&!P.wasBoost)AudioSys.whoosh();P.wasBoost=P.boosting;
  let target,rate;
  if(state==='finishing'){target=0;rate=1.3;}else if(state==='failing'){target=0;rate=2.6;}
  else if(P.stun>0){target=CFG.STUN_SPEED;rate=3;}
  else{target=P.boosting?CFG.BOOST:CFG.BASE;rate=P.speed<target?(P.boosting?CFG.ACC_BOOST:CFG.ACC):CFG.DEC;}
  P.speed+=(target-P.speed)*(1-Math.exp(-rate*dt));
  P.z+=P.speed*dt;
  if(state==='failing'&&P.z>CFG.ROUTE-4){P.z=CFG.ROUTE-4;P.speed=Math.min(P.speed,2);}
  P.pop+=((P.boosting?1:0)-P.pop)*(1-Math.exp(-10*dt));
  boostT+=((P.boosting?1:0)-boostT)*(1-Math.exp(-4*dt));
  if(P.boosting&&Math.random()<dt*40){const L=localFn(roadX(P.z)+P.lx,P.z,Math.atan(roadSlope(P.z)));const p=L(0.45,-2.1,0.35);
    addPart({k:'puff',x:p[0],y:p[1],z:p[2],vx:(Math.random()-.5)*1.5,vy:0.6,vz:P.speed*0.72,g:0,life:0.35,max:0.35,s:0.22});}
}
function scrape(s){
  const x=roadX(player.z)+player.lx+s*0.85;
  for(let i=0;i<8;i++)addPart({k:'spark',x,y:0.4,z:player.z+(Math.random()-.5)*2,vx:-s*Math.random()*3,vy:2+Math.random()*3,vz:player.speed*0.6+Math.random()*4,g:16,life:0.35,max:0.35,hue:Math.random()*60});
  AudioSys.noise(0.12,0.18,3000);
}
function updateTraffic(dt){
  const P=player;
  for(const c of traffic){
    if(c.hit){c.hitT+=dt;c.vy-=18*dt;c.y+=c.vy*dt;if(c.y<0){c.y=0;c.vy=Math.abs(c.vy)>1.5?-c.vy*0.35:0;}
      c.lx+=c.push*dt;c.push*=Math.exp(-3*dt);c.lx=clamp(c.lx,-6.1,6.1);c.v+=(CFG.TRAFFIC_V-c.v)*(1-Math.exp(-1.5*dt));
      c.yawOff=Math.sin(c.hitT*18)*0.35*Math.exp(-c.hitT*2.5);}
    c.z+=c.v*dt;
  }
  traffic=traffic.filter(c=>c.z>P.z-30&&c.z<P.z+420);
  if(state==='playing'){
    spawner.acc+=(P.speed-CFG.TRAFFIC_V)*dt;
    if(spawner.acc>=spawner.next){spawner.acc-=spawner.next;const zs=P.z+CFG.SPAWN_AHEAD;if(zs<CFG.ROUTE+80)spawnWave(zs,false);}
  }
  // oncoming lanes on Lake Shore Drive (visual only)
  spawner.onT-=dt;
  if(spawner.onT<=0){spawner.onT=0.35+Math.random()*0.8;const zs=cam.z+300;
    if(zs>1130&&zs<1850){const lx=[-12.25,-15.75,-19.25,-22.75][(Math.random()*4)|0];const type=Math.random()<0.3?'suv':'sedan';
      oncoming.push({kind:'onc',type,lx,z:zs,w:VEH[type].w,l:VEH[type].l,col:CAR_COLS[(Math.random()*CAR_COLS.length)|0],v:-24,y:0});}}
  for(const c of oncoming)c.z+=c.v*dt;
  oncoming=oncoming.filter(c=>c.z>cam.z-10&&c.z>1118);
}
function checkCollisions(){
  const P=player;
  for(const c of traffic){
    if(c.hit)continue;
    const dz=Math.abs(c.z-P.z),dx=Math.abs(c.lx-P.lx);
    if(dz<c.l*0.46+CFG.PL*0.46&&dx<c.w*0.44+CFG.PW*0.44){
      if(P.invuln>0){c.ghost=true;continue;}
      crash(c);break;
    }
    if(!c.passed&&c.z+c.l/2<P.z-CFG.PL/2){c.passed=true;
      if(!c.ghost){const gap=dx-(c.w/2+CFG.PW/2);if(gap<0.75&&gap>-0.3)nearMiss();}}
  }
}
function crash(c){
  const P=player;stats.hits++;
  P.speed=Math.max(9,P.speed*0.32);P.stun=CFG.STUN;P.invuln=CFG.INVULN;P.energy=Math.max(0,P.energy-CFG.E_HIT);
  const side=Math.sign(c.lx-P.lx)||(Math.random()<.5?-1:1);
  P.vx=-side*7;
  c.hit=true;c.hitT=0;c.vy=5.5;c.push=side*3.5;c.v=CFG.TRAFFIC_V+7;
  shake=1;flash=1;
  const x=roadX(P.z)+P.lx+side*0.6,z=P.z+(c.z>P.z?1.8:-1.8);
  for(let i=0;i<26;i++){const a=Math.random()*Math.PI*2;addPart({k:'spark',x,y:0.8,z,vx:Math.cos(a)*(3+Math.random()*7),vy:2+Math.random()*6,vz:Math.sin(a)*6+P.speed*0.4,g:18,life:0.55,max:0.55,hue:Math.random()*60});}
  const b=T().bonk;popup(b[(Math.random()*b.length)|0],'#ffffff',true);
  AudioSys.bonk();
  const hc=$('#hitsCard');hc.classList.remove('bump');void hc.offsetWidth;hc.classList.add('bump');
}
function nearMiss(){
  stats.near++;player.energy=Math.min(CFG.E_MAX,player.energy+CFG.E_NEAR);
  popup(T().near,'#41B6E6',false);AudioSys.near();
}
function updateEffects(dt){
  for(const p of particles){p.life-=dt;p.vy-=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.y<0&&p.k!=='puff'){p.y=0;p.vy*=-0.3;}if(p.rot!==undefined)p.rot+=p.vr*dt;}
  particles=particles.filter(p=>p.life>0);
  for(const u of popups)u.t+=dt;popups=popups.filter(u=>u.t<u.life);
  shake*=Math.exp(-5*dt);if(shake<0.01)shake=0;flash=Math.max(0,flash-dt*3.5);
}
function updateCamera(dt){
  const P=player;const bt=boostT;
  const back=CAM_BACK+2*bt,h=CAM_H-0.5*bt;
  cam.z=P.z-back;
  const tx=(roadX(cam.z)+roadX(P.z))*0.5+P.lx*0.45;const k=1-Math.exp(-7*dt);
  cam.x+=(tx-cam.x)*k;cam.y=h;
  const ty=Math.atan(roadSlope(P.z+18))*0.9+(state==='menu'?Math.sin(time*0.25)*0.035:0);
  cam.yaw+=(ty-cam.yaw)*k;cam.fov=(FOV+10*bt)*Math.PI/180;cam.pitch=PITCH;
  if(shake>0){const s=shake*(REDUCED?0.3:1);cam.x+=(Math.random()-.5)*s*0.9;cam.y+=(Math.random()-.5)*s*0.5;cam.yaw+=(Math.random()-.5)*s*0.012;}
}
function confetti(){
  const cols=['#E4002B','#41B6E6','#ffffff','#FFB23F','#29d17a'];const x=roadX(player.z)+player.lx;
  for(let i=0;i<90;i++)addPart({k:'conf',x:x+(Math.random()-.5)*8,y:1+Math.random()*2,z:player.z+4+Math.random()*10,vx:(Math.random()-.5)*6,vy:4+Math.random()*7,vz:player.speed*0.8+(Math.random()-.5)*4,g:6,life:2.4,max:2.4,c:cols[i%5],rot:Math.random()*6,vr:(Math.random()-.5)*14});

function update(dt){
  time+=dt;
  updateTrains(dt);
  if(state==='countdown'){
    countT+=dt;const idx=Math.floor(countT/0.75);
    if(idx!==countIdx&&idx<3){countIdx=idx;showCount(T().count[idx]);AudioSys.beep(false);}
    if(countT>=2.25){state='playing';showCount(T().count[3]);AudioSys.beep(true);player.speed=CFG.START_SPEED;}
  }
  if(countHideAt&&time>countHideAt){$('#count').classList.remove('pop');countHideAt=0;}
  const live=state==='playing'||state==='finishing'||state==='failing';
  if(live){
    if(state==='playing'){rem-=dt;elapsed+=dt;}
    updatePlayer(dt);updateTraffic(dt);
    if(state==='playing'){
      checkCollisions();
      if(player.z>=CFG.ROUTE){state='finishing';endT=0;finishTime=CFG.TIME-Math.max(0,rem);rem=Math.max(0,rem);AudioSys.win();confetti();}
      else if(rem<=0){rem=0;state='failing';endT=0;AudioSys.lose();}
      const zi=zoneIdx(player.z);if(zi!==curZone){curZone=zi;showZone(T().zones[zi]);}
      for(const [z,k] of [[284,'toastMadison'],[562,'toastRiver'],[966,'toastTower'],[1336,'toastLSD']])if(player.z>z&&!toastsDone[k]){toastsDone[k]=1;showToast(T()[k]);}
      if(rem<10){const s=Math.ceil(rem);if(s!==lastTick){lastTick=s;AudioSys.tick();}}
    }else{endT+=dt;if(state==='finishing'&&endT>1.8)showResult(true);else if(state==='failing'&&endT>1.6)showResult(false);}
  }else if(state==='menu'||state==='countdown'){boostT=0;}
  updateEffects(dt);
  updateCamera(dt);
  AudioSys.engine(state==='playing'||state==='finishing'||state==='countdown',player.speed/CFG.BOOST,player.boosting);
}

/* test hooks (used for automated verification; harmless in play) */
function botKeys(mode,t){
  const P=player;let best=0,bestScore=-1e9;
  for(let i=0;i<4;i++){let d=200;for(const c of traffic){if(c.hit||c.z<P.z-3)continue;if(Math.abs(c.lx-LANES[i])<2.2){d=Math.min(d,c.z-c.l/2-P.z);}}
    const score=d-Math.abs(LANES[i]-P.lx)*2.2;if(score>bestScore){bestScore=score;best=i;}}
  const tx=LANES[best];keys.left=P.lx>tx+0.25;keys.right=P.lx<tx-0.25;
  keys.boost=mode==='full'?true:mode==='half'?(Math.floor(t*2)%4===0||P.energy>90):mode==='smart'?(P.energy>35||(P.boosting&&P.energy>0)):false;
}
window.__crh={
  get state(){return state;},
  info(){return {state,rem:+rem.toFixed(2),z:+player.z.toFixed(1),lx:+player.lx.toFixed(2),speed:+player.speed.toFixed(2),energy:+player.energy.toFixed(1),hits:stats.hits,near:stats.near,traffic:traffic.length,boosting:player.boosting,invuln:+player.invuln.toFixed(2),trains:trains.length};},
  sim(sec,k,step){step=step||1/60;Object.assign(keys,{left:false,right:false,boost:false},k||{});let t=0;while(t<sec-1e-9){update(step);t+=step;if(state==='won'||state==='lost')break;}Object.assign(keys,{left:false,right:false,boost:false});return this.info();},
  teleport(z){player.z=z;traffic=traffic.filter(c=>c.z>z+40);updateCamera(1);},
  clearTraffic(){traffic=[];},
  cars(){return traffic.filter(c=>!c.hit).map(c=>({lx:c.lx,z:c.z,l:c.l,w:c.w}));},
  bot(boostMode,maxSec,step){ // simple driver for balance testing: picks the lane with most room
    step=step||1/60;let t=0;
    while(t<maxSec&&state!=='won'&&state!=='lost'){
      botKeys(boostMode,t);update(step);t+=step;
    }
    keys.left=keys.right=keys.boost=false;return Object.assign(this.info(),{finishTime:+finishTime.toFixed(2),boostTime:+stats.boostTime.toFixed(1)});
  },
  placeCar(dz,lane){const sp=VEH.sedan;traffic.push({kind:'car',type:'sedan',lx:lane===undefined?player.lx:LANES[lane],z:player.z+dz,w:sp.w,l:sp.l,col:[31,181,214],v:CFG.TRAFFIC_V,y:0,vy:0,hit:false,passed:false,ghost:false,yawOff:0,push:0,hitT:0,route:'36'});},
  prof(){const r={};for(const k in PROF)r[k]=k==='n'||k==='l1n'?PROF[k]:+(PROF[k]/Math.max(1,PROF.n)).toFixed(2);for(const k in PROF)PROF[k]=0;return r;},
  setRem(v){rem=v;}, keys, start:startGame, pause, resume, cfg:CFG,
  lanesFree(){ // for each wave-ish cluster ahead, verify at least one lane is free
    const rows={};for(const c of traffic){if(c.hit)continue;const k=Math.round(c.z/12);(rows[k]=rows[k]||new Set()).add(LANES.indexOf(c.lx));}
    return Object.values(rows).every(s=>s.size<4);}
};
})();
